<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Sentinel ingestion pipeline - Gmail, Calendar and Slack are gated by the hasCrmParticipant() permission filter against a Contact book synced read-only from HubSpot and Salesforce. A message is persisted only when a participant is in the CRM; otherwise it is dropped to an outcome metric.">
  <title>Sentinel ingestion pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="520" rx="16"/></clipPath>
    <path id="mA" d="M280 146 C 400 146 480 196 560 208 C 700 205 800 200 898 200"/>
    <path id="mB" d="M280 210 C 400 210 480 216 560 218 C 700 218 800 214 898 212"/>
    <path id="mC" d="M280 274 C 380 274 470 270 558 268"/>
    <path id="mL" d="M560 366 L560 302"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="520" fill="url(#bg)"/>

    <!-- header row -->
    <path transform="translate(80 64)" fill="#6E6E6C" d="@@akicker@@"/>

    <!-- zone labels -->
    <path transform="translate(80 110)" fill="#5E5E5C" d="@@azSources@@"/>
    <path transform="translate(898 146)" fill="#5E5E5C" d="@@azOutcome@@"/>
    <path transform="translate(340 346)" fill="#5E5E5C" d="@@azSync@@"/>

    <!-- flows (under nodes) -->
    <g fill="none" stroke="#3E3E3C" stroke-width="1.5">
      <path d="M280 146 C 400 146 480 196 560 208"/>
      <path d="M280 210 C 400 210 480 216 560 218"/>
      <path d="M280 274 C 380 274 470 270 558 268"/>
    </g>
    <g fill="none" stroke="#E8E8E6" stroke-width="1.6" opacity="0.9">
      <path d="M560 208 C 700 205 800 200 898 200"/>
      <path d="M560 218 C 700 218 800 214 898 212"/>
    </g>
    <path d="M560 368 V300" fill="none" stroke="#4A4A48" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
    <path d="M556 307 L560 299 L564 307" fill="none" stroke="#6E6E6C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(576 338)" fill="#6E6E6C" d="@@aLookup@@"/>
    <path transform="translate(780 190)" fill="#8F8F8D" d="@@akept@@"/>

    <!-- source boxes -->
    <g fill="#101010" stroke="#272725" stroke-width="1">
      <rect x="80" y="124" width="200" height="44" rx="10"/>
      <rect x="80" y="188" width="200" height="44" rx="10"/>
      <rect x="80" y="252" width="200" height="44" rx="10"/>
    </g>
    <!-- gmail icon -->
    <g stroke="#8A8A88" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="98" y="139" width="20" height="14" rx="2.5"/>
      <path d="M99 141 L108 148 L117 141"/>
    </g>
    <path transform="translate(132 151)" fill="#D6D6D4" d="@@aGmail@@"/>
    <!-- calendar icon -->
    <g stroke="#8A8A88" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="98" y="204" width="20" height="15" rx="2.5"/>
      <path d="M98 209 H118"/>
      <path d="M103 201 V206 M113 201 V206"/>
    </g>
    <path transform="translate(132 215)" fill="#D6D6D4" d="@@aCal@@"/>
    <!-- slack icon -->
    <g stroke="#8A8A88" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M104 268 L101 281 M114 268 L111 281 M98 271.5 H116 M96 277.5 H114"/>
    </g>
    <path transform="translate(132 279)" fill="#D6D6D4" d="@@aSlack@@"/>
    <!-- exit nodes -->
    <circle cx="280" cy="146" r="2.6" fill="none" stroke="#5E5E5C" stroke-width="1.3"/>
    <circle cx="280" cy="210" r="2.6" fill="none" stroke="#5E5E5C" stroke-width="1.3"/>
    <circle cx="280" cy="274" r="2.6" fill="none" stroke="#5E5E5C" stroke-width="1.3"/>

    <!-- wall with aperture -->
    <g stroke="#3A3A38" stroke-width="2">
      <path d="M560 100 V198"/>
      <path d="M560 232 V292"/>
    </g>
    <g stroke="#F5F5F3" stroke-width="2">
      <path d="M553 198 H567"/>
      <path d="M553 232 H567"/>
    </g>

    <!-- callout -->
    <path d="M567 196 L600 150 L614 150" fill="none" stroke="#4A4A48" stroke-width="1"/>
    <path transform="translate(620 154)" fill="#F5F5F3" d="@@acall1@@"/>
    <path transform="translate(620 171)" fill="#757573" d="@@acall2@@"/>

    <!-- dropped annotation: pinned on the wall -->
    <path d="M555 263 L565 273 M565 263 L555 273" stroke="#C25E52" stroke-width="2" stroke-linecap="round"/>
    <path transform="translate(540 296)" fill="#9A9A98" d="@@aDrop1@@"/>
    <path transform="translate(540 312)" fill="#6E6E6C" d="@@aDrop2@@"/>

    <!-- persisted box -->
    <rect x="898" y="160" width="226" height="122" rx="12" fill="#101010" stroke="#2C2C2A" stroke-width="1"/>
    <rect x="898" y="166" width="2.5" height="110" fill="#F5F5F3"/>
    <circle cx="928" cy="191" r="8" fill="none" stroke="#B5B5B3" stroke-width="1.5"/>
    <path d="M924.5 191 l2.6 2.6 l5 -5.8" fill="none" stroke="#F5F5F3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(944 196)" fill="#F5F5F3" d="@@aPersistTitle@@"/>
    <path transform="translate(918 226)" fill="#8F8F8D" d="@@aP1@@"/>
    <path transform="translate(918 244)" fill="#8F8F8D" d="@@aP2@@"/>
    <path transform="translate(918 262)" fill="#8F8F8D" d="@@aP3a@@"/>
    <path transform="translate(@@x:aP3a:918:7@@ 262)" fill="#F5F5F3" d="@@aP3b@@"/>

    <!-- crm sync -->
    <g fill="#101010" stroke="#272725" stroke-width="1">
      <rect x="340" y="362" width="112" height="36" rx="10"/>
      <rect x="340" y="410" width="112" height="36" rx="10"/>
    </g>
    <circle cx="356" cy="380" r="2.6" fill="#8A8A88"/>
    <path transform="translate(368 384)" fill="#D6D6D4" d="@@aHub@@"/>
    <circle cx="356" cy="428" r="2.6" fill="#8A8A88"/>
    <path transform="translate(368 432)" fill="#D6D6D4" d="@@aSf@@"/>
    <!-- sync arrows -->
    <g fill="none" stroke="#3E3E3C" stroke-width="1.5">
      <path d="M452 380 H484"/>
      <path d="M452 428 H484"/>
    </g>
    <g fill="none" stroke="#6E6E6C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M480 376 l5 4 l-5 4"/>
      <path d="M480 424 l5 4 l-5 4"/>
    </g>
    <!-- contact book cylinder (directly beneath the gate) -->
    <path d="M490 380 V448 A70 12 0 0 0 630 448 V380" fill="#101010" stroke="#3A3A38" stroke-width="1.1"/>
    <ellipse cx="560" cy="380" rx="70" ry="12" fill="#131313" stroke="#3A3A38" stroke-width="1.1"/>
    <path transform="translate(560 414)" fill="#E8E8E6" d="@@aBook@@"/>
    <path transform="translate(560 431)" fill="#8F8F8D" d="@@aBook2@@"/>
    <path transform="translate(560 446)" fill="#6E6E6C" d="@@aBook3@@"/>

    <!-- refs -->
    <path transform="translate(80 492)" fill="#5E5E5C" d="@@aRefs@@"/>

    <!-- animation -->
    <circle r="2.4" fill="#E8E8E6" opacity="0">
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#mA"/></animateMotion>
      <animate attributeName="opacity" dur="6s" begin="0s" repeatCount="indefinite" values="0;0.7;0.7;0" keyTimes="0;0.05;0.92;1"/>
    </circle>
    <circle r="2.4" fill="#E8E8E6" opacity="0">
      <animateMotion dur="6s" begin="3s" repeatCount="indefinite"><mpath xlink:href="#mB"/></animateMotion>
      <animate attributeName="opacity" dur="6s" begin="3s" repeatCount="indefinite" values="0;0.7;0.7;0" keyTimes="0;0.05;0.92;1"/>
    </circle>
    <circle r="2.2" fill="#8A8A88" opacity="0">
      <animateMotion dur="5s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#mC"/></animateMotion>
      <animate attributeName="opacity" dur="5s" begin="1.5s" repeatCount="indefinite" values="0;0.7;0.7;0" keyTimes="0;0.07;0.88;1"/>
    </circle>
    <circle r="2.2" fill="#7A7A78" opacity="0">
      <animateMotion dur="7s" begin="2s" repeatCount="indefinite"><mpath xlink:href="#mL"/></animateMotion>
      <animate attributeName="opacity" dur="7s" begin="2s" repeatCount="indefinite" values="0;0.6;0.6;0" keyTimes="0;0.08;0.88;1"/>
    </circle>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
