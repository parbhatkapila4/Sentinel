<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Sentinel ingestion pipeline - Gmail, Calendar and Slack are gated by the hasCrmParticipant() permission filter against a Contact book synced read-only from HubSpot and Salesforce. A message is persisted only when a participant is in the CRM; otherwise it is dropped to an outcome metric.">
  <title>Sentinel ingestion pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0B09"/>
      <stop offset="1" stop-color="#0A0907"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#F2EEE6" opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="560" rx="20"/></clipPath>
    <path id="mA" d="M280 146 C 400 146 480 196 558 208 L562 208 C 700 205 800 200 898 200"/>
    <path id="mB" d="M280 210 C 400 210 480 216 558 218 L562 218 C 700 218 800 214 898 212"/>
    <path id="mC" d="M280 274 C 380 274 470 270 558 268"/>
    <path id="mL" d="M560 366 L560 302"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="560" fill="url(#bg)"/>

    <!-- drafting frame -->
    <rect x="32" y="32" width="1136" height="496" fill="none" stroke="#F2EEE6" stroke-opacity="0.08"/>
    <rect x="33" y="33" width="1134" height="452" fill="url(#dots)"/>
    <g stroke="#B9853F" stroke-width="1.4" fill="none" opacity="0.9">
      <path d="M32 44 V32 H44"/>
      <path d="M1156 32 H1168 V44"/>
      <path d="M1168 516 V528 H1156"/>
      <path d="M44 528 H32 V516"/>
    </g>

    <!-- header row -->
    <path transform="translate(80 65)" fill="#948B7D" d="@@akickerA@@"/>
    <path transform="translate(@@x:akickerA:80:12@@ 65)" fill="#7A7163" d="@@akickerDot@@"/>
    <path transform="translate(@@x:akickerA:80:26@@ 65)" fill="#D9A85C" d="@@akickerB@@"/>
    <path transform="translate(1156 65)" fill="#7A7163" d="@@afig@@"/>

    <!-- zone labels -->
    <path transform="translate(80 110)" fill="#7A7163" d="@@azSources@@"/>
    <path transform="translate(898 146)" fill="#7A7163" d="@@azOutcome@@"/>
    <path transform="translate(340 346)" fill="#7A7163" d="@@azSync@@"/>

    <!-- flows (under nodes) -->
    <g fill="none" stroke="#524C40" stroke-width="1.5">
      <path d="M280 146 C 400 146 480 196 560 208"/>
      <path d="M280 210 C 400 210 480 216 560 218"/>
      <path d="M280 274 C 380 274 470 270 558 268"/>
    </g>
    <g fill="none" stroke="#C08A45" stroke-width="1.6" opacity="0.9">
      <path d="M560 208 C 700 205 800 200 898 200"/>
      <path d="M560 218 C 700 218 800 214 898 212"/>
    </g>
    <path d="M560 368 V300" fill="none" stroke="#5E5236" stroke-width="1.4" stroke-dasharray="2 5" stroke-linecap="round"/>
    <path d="M556 307 L560 299 L564 307" fill="none" stroke="#6E5A34" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(576 338)" fill="#857C6E" d="@@aLookup@@"/>
    <path transform="translate(780 190)" fill="#C99A55" d="@@akept@@"/>

    <!-- source boxes -->
    <g fill="#12100D" stroke="#3A342B" stroke-width="1">
      <rect x="80" y="124" width="200" height="44" rx="8"/>
      <rect x="80" y="188" width="200" height="44" rx="8"/>
      <rect x="80" y="252" width="200" height="44" rx="8"/>
    </g>
    <!-- gmail icon -->
    <g stroke="#B79A66" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="98" y="139" width="20" height="14" rx="2.5"/>
      <path d="M99 141 L108 148 L117 141"/>
    </g>
    <path transform="translate(132 151)" fill="#C9C0B2" d="@@aGmail@@"/>
    <!-- calendar icon -->
    <g stroke="#B79A66" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="98" y="204" width="20" height="15" rx="2.5"/>
      <path d="M98 209 H118"/>
      <path d="M103 201 V206 M113 201 V206"/>
    </g>
    <path transform="translate(132 215)" fill="#C9C0B2" d="@@aCal@@"/>
    <!-- slack icon -->
    <g stroke="#B79A66" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M104 268 L101 281 M114 268 L111 281 M98 271.5 H116 M96 277.5 H114"/>
    </g>
    <path transform="translate(132 279)" fill="#C9C0B2" d="@@aSlack@@"/>
    <!-- exit nodes -->
    <circle cx="280" cy="146" r="2.6" fill="none" stroke="#7A7163" stroke-width="1.3"/>
    <circle cx="280" cy="210" r="2.6" fill="none" stroke="#7A7163" stroke-width="1.3"/>
    <circle cx="280" cy="274" r="2.6" fill="none" stroke="#7A7163" stroke-width="1.3"/>

    <!-- wall with a true aperture -->
    <g stroke="#625948" stroke-width="2">
      <path d="M560 100 V198"/>
      <path d="M560 232 V292"/>
    </g>
    <path d="M556 100 H564" stroke="#625948" stroke-width="1.4"/>
    <g stroke="#E2A24E" stroke-width="2">
      <path d="M553 198 H567"/>
      <path d="M553 232 H567"/>
    </g>

    <!-- callout -->
    <path d="M567 196 L600 150 L614 150" fill="none" stroke="#5E5749" stroke-width="1"/>
    <path transform="translate(620 154)" fill="#D9A85C" d="@@acall1@@"/>
    <path transform="translate(620 171)" fill="#857C6E" d="@@acall2@@"/>

    <!-- dropped annotation: pinned on the wall -->
    <path d="M555 263 L565 273 M565 263 L555 273" stroke="#C4695A" stroke-width="2" stroke-linecap="round"/>
    <path transform="translate(540 296)" fill="#A39684" d="@@aDrop1@@"/>
    <path transform="translate(540 312)" fill="#857C6E" d="@@aDrop2@@"/>

    <!-- persisted box -->
    <rect x="898" y="160" width="226" height="122" rx="10" fill="#14110B" stroke="#5E4A26" stroke-width="1"/>
    <rect x="898" y="160" width="3" height="122" fill="#D9A85C"/>
    <circle cx="928" cy="191" r="8" fill="none" stroke="#E2A24E" stroke-width="1.5"/>
    <path d="M924.5 191 l2.6 2.6 l5 -5.8" fill="none" stroke="#F2C886" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path transform="translate(944 196)" fill="#F0EADF" d="@@aPersistTitle@@"/>
    <path transform="translate(918 226)" fill="#A89A82" d="@@aP1@@"/>
    <path transform="translate(918 244)" fill="#857C6E" d="@@aP2@@"/>
    <path transform="translate(918 262)" fill="#857C6E" d="@@aP3a@@"/>
    <path transform="translate(@@x:aP3a:918:7@@ 262)" fill="#D9A85C" d="@@aP3b@@"/>

    <!-- crm sync -->
    <g fill="#12100D" stroke="#3A342B" stroke-width="1">
      <rect x="340" y="362" width="112" height="36" rx="8"/>
      <rect x="340" y="410" width="112" height="36" rx="8"/>
    </g>
    <circle cx="356" cy="380" r="2.6" fill="#B79A66" opacity="0.85"/>
    <path transform="translate(368 384)" fill="#C9C0B2" d="@@aHub@@"/>
    <circle cx="356" cy="428" r="2.6" fill="#B79A66" opacity="0.85"/>
    <path transform="translate(368 432)" fill="#C9C0B2" d="@@aSf@@"/>
    <!-- sync arrows -->
    <g fill="none" stroke="#4A443A" stroke-width="1.4">
      <path d="M452 380 H484"/>
      <path d="M452 428 H484"/>
    </g>
    <g fill="none" stroke="#6E665A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M480 376 l5 4 l-5 4"/>
      <path d="M480 424 l5 4 l-5 4"/>
    </g>
    <!-- contact book cylinder (directly beneath the gate) -->
    <path d="M490 380 V448 A70 12 0 0 0 630 448 V380" fill="#12100D" stroke="#5A4A2E" stroke-width="1.1"/>
    <ellipse cx="560" cy="380" rx="70" ry="12" fill="#191410" stroke="#6E5A34" stroke-width="1.1"/>
    <path transform="translate(560 414)" fill="#F0EADF" d="@@aBook@@"/>
    <path transform="translate(560 431)" fill="#A99A7E" d="@@aBook2@@"/>
    <path transform="translate(560 446)" fill="#7E7461" d="@@aBook3@@"/>

    <!-- title block -->
    <path d="M32 486 H1168" stroke="#F2EEE6" stroke-opacity="0.08"/>
    <g stroke="#F2EEE6" stroke-opacity="0.08">
      <path d="M462 486 V528"/>
      <path d="M712 486 V528"/>
    </g>
    <path transform="translate(80 512)" fill="#7A7163" d="@@atbL1@@"/>
    <path transform="translate(@@x:atbL1:80:14@@ 512)" fill="#9C9385" d="@@atbV1@@"/>
    <path transform="translate(486 512)" fill="#7A7163" d="@@atbL2@@"/>
    <path transform="translate(@@x:atbL2:486:14@@ 512)" fill="#9C9385" d="@@atbV2@@"/>
    <path transform="translate(736 512)" fill="#7A7163" d="@@atbL3@@"/>
    <path transform="translate(@@x:atbL3:736:14@@ 512)" fill="#9C9385" d="@@atbV3@@"/>

    <!-- animation -->
    <circle r="2.6" fill="#E9C489" opacity="0">
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#mA"/></animateMotion>
      <animate attributeName="opacity" dur="6s" begin="0s" repeatCount="indefinite" values="0;0.9;0.9;0" keyTimes="0;0.05;0.92;1"/>
    </circle>
    <circle r="2.6" fill="#E9C489" opacity="0">
      <animateMotion dur="6s" begin="3s" repeatCount="indefinite"><mpath xlink:href="#mB"/></animateMotion>
      <animate attributeName="opacity" dur="6s" begin="3s" repeatCount="indefinite" values="0;0.9;0.9;0" keyTimes="0;0.05;0.92;1"/>
    </circle>
    <circle r="2.4" fill="#B99B6F" opacity="0">
      <animateMotion dur="5s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#mC"/></animateMotion>
      <animate attributeName="opacity" dur="5s" begin="1.5s" repeatCount="indefinite" values="0;0.85;0.85;0" keyTimes="0;0.07;0.88;1"/>
    </circle>
    <circle r="2.2" fill="#9A864E" opacity="0">
      <animateMotion dur="7s" begin="2s" repeatCount="indefinite"><mpath xlink:href="#mL"/></animateMotion>
      <animate attributeName="opacity" dur="7s" begin="2s" repeatCount="indefinite" values="0;0.7;0.7;0" keyTimes="0;0.08;0.88;1"/>
    </circle>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="559" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
