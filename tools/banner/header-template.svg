<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Sentinel - CRM is the permission layer. A message is ingested only if a participant already exists in your CRM.">
  <title>Sentinel - CRM is the permission layer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFAF9"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="280" rx="16"/></clipPath>
    <path id="mMid" d="M740 140 H1062"/>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>

    <path transform="translate(90 138)" fill="#0A0A0A" d="@@wordmark@@"/>
    <path transform="translate(96 188)" fill="#7C7C7A" d="@@taglineA@@"/>
    <path transform="translate(@@x:taglineA:96:0@@ 188)" fill="#0A0A0A" d="@@taglineB@@"/>
    <path transform="translate(96 218)" fill="#8A8A88" d="@@support@@"/>

    <!-- gate mark: three flows, one admitted -->
    <g fill="none" stroke="#D0D0CE" stroke-width="1.5" stroke-linecap="round">
      <path d="M740 104 C 840 104 888 122 960 125"/>
      <path d="M740 176 C 840 176 888 158 960 155"/>
      <path d="M740 140 H974"/>
    </g>
    <circle cx="963" cy="125" r="2.2" fill="#D0D0CE"/>
    <circle cx="963" cy="155" r="2.2" fill="#D0D0CE"/>
    <path d="M981 140 H1062" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="976.4" y="108" width="3.2" height="64" rx="1.6" fill="#0A0A0A"/>
    <circle cx="1070" cy="140" r="4" fill="#0A0A0A"/>

    <circle r="2.4" fill="#0A0A0A" opacity="0">
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#mMid"/></animateMotion>
      <animate attributeName="opacity" dur="6s" begin="0s" repeatCount="indefinite" values="0;0.35;0.35;0" keyTimes="0;0.08;0.9;1"/>
    </circle>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="279" rx="16" fill="none" stroke="#000000" stroke-opacity="0.08"/>
</svg>
